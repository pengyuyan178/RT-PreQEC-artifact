[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-preqec"
version = "0.1.0"
description = "Lag-bounded real-time scheduling runtime for quantum error correction decoders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "tqdm",
  "typer",
  "rich",
  "matplotlib",
  "scikit-learn",
  "torch",
  "stim",
  "sinter",
  "pymatching",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
]

[project.scripts]
rt-preqec-generate = "scripts.generate_dataset:app"
rt-preqec-train = "scripts.train_predecoder:app"
rt-preqec-eval = "scripts.evaluate_realtime:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
